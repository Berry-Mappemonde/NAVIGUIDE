# =============================================================================
# NAVIGUIDE Simulator - Hardened Nginx Reverse Proxy Configuration
# Fixes for OWASP ZAP Baseline Scan (GitHub Issue #2)
# =============================================================================

# 1. Hide server version info from HTTP response headers (eliminates daemon leakage)
server_tokens off;

upstream simulator_backend {
    server 127.0.0.1:8010;
    keepalive 32;
}

server {
    listen 80;
    server_name simulator.naviguide.fr naviguide.fr;

    # Automatic HTTPS redirection
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name simulator.naviguide.fr naviguide.fr;

    # -------------------------------------------------------------------------
    # TLS Configuration (Certbot managed)
    # -------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/simulator.naviguide.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simulator.naviguide.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # -------------------------------------------------------------------------
    # Security Headers (OWASP ZAP Hardening)
    # -------------------------------------------------------------------------

    # 1. HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 2. Cross-Origin Policies (COOP, COEP, CORP)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # 3. Standard Clickjacking, Sniffing & Referrer Protection
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    # 4. Content Security Policy (Enforced mode, explicit origin lockdown)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.openseamap.org https://server.arcgisonline.com; connect-src 'self' https://blueintelligence.online https://server.arcgisonline.com; font-src 'self' data:; frame-ancestors 'self' https://*.naviguide.fr https://blueintelligence.online; object-src 'none'; base-uri 'self';" always;

    # -------------------------------------------------------------------------
    # Upstream Proxy Rules & Information Disclosure Defense
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://simulator_backend;
        proxy_http_version 1.1;

        # WebSockets support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hide internal application server signatures (e.g., Uvicorn, Python)
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        proxy_read_timeout 120s;
    }
}
