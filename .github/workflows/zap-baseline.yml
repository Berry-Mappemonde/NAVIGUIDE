name: ZAP baseline — simulateur (mensuel)

# Sécurité P1 : un passage OWASP ZAP « baseline » (passif, sans
# attaque) sur https://naviguide.fr, le 1er de chaque mois et à la demande.
# Ne bloque rien : le rapport est attaché en artefact. Les alertes sont
# écrites sur l'issue transférée
# https://github.com/Berry-Mappemonde/NAVIGUIDE/issues/2
# Le titre d'issue reste « ZAP baseline — simulateur » : l'action met à
# jour cette issue au lieu d'en ouvrir une autre. Pas de scan actif.
# Le passage à la main (workflow_dispatch) reste au propriétaire.

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: ZAP baseline sur https://naviguide.fr (issue #2)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://naviguide.fr"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j"
          fail_action: false
          allow_issue_writing: true
          issue_title: "ZAP baseline — simulateur"
          artifact_name: "zap-simulateur"
