name: Documentation

# Site MkDocs Material. Le job construit en mode strict et s'arrête.
# Pas de pages GitHub, pas de gh-deploy, pas d'artefact publié.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer MkDocs
        run: pip install -r docs/requirements-docs.txt
      - name: Liens relatifs du dépôt
        run: python3 docs/check_md_links.py
      - name: Construire le site
        run: mkdocs build --strict
