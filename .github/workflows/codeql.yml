name: CodeQL

# Python et JavaScript/TypeScript. Les alertes vont dans l'onglet Security.
# Une alerte ne fait pas échouer ce workflow : il n'est pas un check requis,
# et l'action d'analyse ne bloque pas sur les résultats.
# Ne pas activer en plus la configuration CodeQL par défaut : ce serait un second scan.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Pas d'autobuild : Python et JavaScript ne se compilent pas.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
