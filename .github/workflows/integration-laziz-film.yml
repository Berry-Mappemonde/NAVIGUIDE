name: Integration Laziz PRs and film audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: laziz-film-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate-and-test:
    name: Integrate open PRs and run simulator checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      branch: ${{ steps.integrate.outputs.branch }}
      sha: ${{ steps.integrate.outputs.sha }}
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Merge PRs into an isolated integration tree
        id: integrate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout --detach origin/main

          # Include the audit/test helper workflows in the resulting branch.
          git fetch origin "+refs/heads/chatgpt/integration-laziz-film-audit-20261027:refs/remotes/origin/film-audit-helper"
          git merge --no-ff --no-edit refs/remotes/origin/film-audit-helper

          # #114 is stacked on #108, so the design-system base must be merged first.
          # If Git reports a conflict, stop and keep main untouched; no automatic conflict resolution.
          for pr in 108 114 99 107 109 110 111 112 113; do
            echo "::group::Merging PR #${pr}"
            git fetch origin "+refs/pull/${pr}/head:refs/remotes/integration/pr-${pr}"
            if ! git merge --no-ff --no-edit "refs/remotes/integration/pr-${pr}"; then
              echo "::error::Merge conflict while integrating PR #${pr}. Resolve it explicitly before rerunning."
              git status --short
              exit 20
            fi
            echo "::endgroup::"
          done

          branch="integration/laziz-film-audit-${GITHUB_RUN_ID}"
          sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "### Integration branch created"
            echo "- Branch: `${branch}`"
            echo "- Commit: `${sha}`"
            echo "- Includes PRs: #108, #114, #99, #107, #109, #110, #111, #112, #113"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: naviguide-simulator/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: naviguide-simulator
        run: npm ci

      - name: JavaScript tests
        working-directory: naviguide-simulator
        run: npm test

      - name: Build Vite
        working-directory: naviguide-simulator
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: naviguide-simulator/server/requirements.txt

      - name: Install Python dependencies
        working-directory: naviguide-simulator
        run: pip install -r server/requirements.txt

      - name: Python tests (including film story pipeline)
        working-directory: naviguide-simulator
        run: python -m pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Install Chromium for Playwright
        working-directory: naviguide-simulator
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        working-directory: naviguide-simulator
        run: npx playwright test e2e/smoke.spec.js

  real-film-audit:
    name: Capture actual production film after integration checks pass
    needs: integrate-and-test
    if: needs.integrate-and-test.result == 'success'
    uses: ./.github/workflows/film-audit.yml
    with:
      seconds: "150"
