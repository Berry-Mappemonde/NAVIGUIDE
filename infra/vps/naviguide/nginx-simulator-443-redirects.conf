# www et simulator en HTTPS → https://naviguide.fr (liens déjà publiés).
# Installé par deploy-simulator.sh dans sites-available/naviguide-443-redirects
# et activé seulement si le certificat naviguide.fr est présent.
# C'est le bloc 443 de nginx-naviguide.conf, sans son bloc 80 : le port 80
# reste au bootstrap HTTP (défi ACME /.well-known/acme-challenge/).
# Non activé si sites-enabled/naviguide l'est déjà (mêmes server_name en 443).
server {
    listen 443 ssl;
    server_name www.naviguide.fr simulator.naviguide.fr;

    ssl_certificate /etc/letsencrypt/live/naviguide.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naviguide.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://naviguide.fr$request_uri;
}
