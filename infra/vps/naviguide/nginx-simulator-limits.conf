# Zones de débit du simulateur (sécurité P0, sept. 2026), installées par
# deploy-simulator.sh dans /etc/nginx/conf.d/naviguide-simulator-limits.conf.
# Une seule définition pour tout nginx : nginx-simulator.conf (443) et le
# bootstrap HTTP de Contabo utilisent ces zones sans les redéclarer.
# Deux déclarations du même nom font échouer nginx -t
# (« limit_req_zone "sim_write" is already bound »).
limit_req_zone $binary_remote_addr zone=sim_write:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sim_story:10m rate=12r/m;
