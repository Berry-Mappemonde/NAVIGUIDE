# Reference copy of /etc/nginx/sites-available/naviguide (OVH VPS).
# TLS: existing Let's Encrypt certificate /etc/letsencrypt/live/naviguide.fr/
# (SAN: naviguide.fr + www.naviguide.fr), renewed by certbot (nginx plugin).
# Canonical: www.naviguide.fr — apex and port 80 redirect with 301.
# Frontend: /var/www/naviguide (copy of naviguide-app/dist/). Do not serve
# from ~/blue-intelligence-map/…: an rsync/chmod 700 of the repo blocks
# www-data and nginx returns 500 (try_files loop) instead of the SPA.
# APIs are split by path onto 127.0.0.1:9000/9004/9008 and :8001.

server {
    listen 443 ssl;
    server_name www.naviguide.fr;

    ssl_certificate /etc/letsencrypt/live/naviguide.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/naviguide.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/naviguide;
    index index.html;
    client_max_body_size 25m;   # upload polaires PDF/CSV/XLSX

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

    # ── naviguide-api: routing, weather, simulation, SSE agents, map proxies ──
    location ~ ^/(route|wind|wave|current|simulation|agents|proxy)(/|$) {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # SSE (agents IA)
        proxy_read_timeout 3600;
    }

    # ── polar-api: polar upload / analysis ─────────────────────────────
    location /api/v1/polar/ {
        proxy_pass http://127.0.0.1:9004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # ── orchestrator: LangGraph AI briefing (~30 s) ─────────────────────────
    location /api/v1/ {
        proxy_pass http://127.0.0.1:9008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # ── Seamap seafloor (local mirror, same VPS as Blue Intelligence) ──────
    location /tiles/seamap/ {
        alias /srv/tiles/seamap/public/;
        add_header Access-Control-Allow-Origin "*" always;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        types {
            application/json json;
            image/png png;
        }
        default_type application/octet-stream;
    }

    # ── Blue Intelligence (same VPS): /bi/* → BI uvicorn /api/* ──────────────
    location /bi/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # ── SPA React (MapLibre) ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

# Apex → www (canonique)
server {
    listen 443 ssl;
    server_name naviguide.fr;

    ssl_certificate /etc/letsencrypt/live/naviguide.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/naviguide.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://www.naviguide.fr$request_uri;
}

# HTTP → HTTPS www
server {
    listen 80;
    server_name naviguide.fr www.naviguide.fr;
    return 301 https://www.naviguide.fr$request_uri;
}
