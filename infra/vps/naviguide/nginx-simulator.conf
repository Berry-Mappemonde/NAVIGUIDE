# Separate nginx site — simulator.naviguide.fr
# Do NOT merge into sites-available/naviguide: www.naviguide.fr stays
# intact (API :9000 / polar+chat :9004 / orchestrator :9008).
#
# TLS: same Let's Encrypt certificate as the skipper site
# (/etc/letsencrypt/live/naviguide.fr/) once expanded to the SAN
# simulator.naviguide.fr (certbot --expand, voir deploy-simulator.sh).
#
# Frontend: /var/www/naviguide-simulator (copy of dist/). Do not serve
# from ~/blue-intelligence-map/… (same lesson as /var/www/naviguide).
#
# Sécurité P0 (sept. 2026) : débit borné par IP sur les écritures et la
# dépense LLM, en plus des limiteurs du serveur (:8010). Les zones sim_write
# et sim_story sont déclarées une seule fois dans nginx-simulator-limits.conf
# (conf.d), installé par deploy-simulator.sh : ne pas les redéclarer ici.

server {
    listen 443 ssl;
    server_name naviguide.fr;
    limit_req_status 429;

    ssl_certificate /etc/letsencrypt/live/naviguide.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naviguide.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/naviguide-simulator;
    index index.html;
    # Polaire ≤ 10 Mo (serveur), route officielle ~1 500 points ≪ 1 Mo.
    client_max_body_size 12m;

    # Sécurité P1 : en-têtes de durcissement. `always` = aussi sur les
    # réponses d'erreur et proxifiées. Le cadrage reste ouvert aux sites de la
    # maison (www.naviguide.fr, blueintelligence.online) qui peuvent embarquer
    # le simulateur. HSTS : un an, sur ce vhost 443 seulement, sans
    # includeSubDomains ni preload. La politique CSP complète reste en
    # report-only (violations dans la console du navigateur, pas dans le
    # journal nginx) : on ne la copie dans Content-Security-Policy qu'après
    # une journée sans violation, en gardant frame-ancestors.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.naviguide.fr https://blueintelligence.online https://www.blueintelligence.online" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Récits LLM : 12 / min / IP (burst court), le serveur coupe aussi à 240 / h.
    location = /ici/story {
        limit_req zone=sim_story burst=6 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # Écritures : création de voyage, recalcul, upload polaire, GRIB forcé.
    # (GET /voyage/official/grib, sondé chaque minute par tous, reste libre.)
    location ~ ^/(voyage$|voyage/official/grib/(refresh|scan)$|voyage/[^/]+/(recompute|accept|reject|refresh-forecast)$|api/v1/polar/upload$) {
        limit_req zone=sim_write burst=10 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # Film et horloge : snapshot déjà rangé. Hors de la file :8010
    # (le briefing /ici l'occupe). Un location = passe avant la regex /voyage.
    location = /voyage/official/film {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location = /voyage/official/clock {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

    # searoute + weather + map proxies + voyage B — backend :8010, not :9000
    # /route.geojson is not matched (dot after route) → static file
    # /weather = composite POST (satellite popup) + GET /weather/forecast
    # (ICI poll); without it nginx answers 405 / serves index.html.
    # /escale = fiche d'escale ; /logbook = chatbot journal.
    # /zee = ZEE ou haute mer du point (film Revoir), sinon index.html.
    location ~ ^/(route|wind|wave|current|weather|proxy|ici|voyage|escale|logbook|zee)(/|$) {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # simulator polar (upload / VMG, no chat) — not naviguide-polar :9004
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # Climatologie BI (atlas immuable) : cache nginx partagé — voir
    # infra/vps/nginx-bi-climatology-cache.conf (incident 2026-09-21).
    location /bi/climatology/ {
        include snippets/bi-climatology-cache.conf;
        proxy_pass https://blueintelligence.online/api/climatology/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host blueintelligence.online;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # Blue Intelligence layers, read-only (same VPS)
    location /bi/ {
        proxy_pass https://blueintelligence.online/api/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host blueintelligence.online;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # RFC 9116. Contact = adresse de SECURITY.md (aucun lien vers le dépôt).
    # Ce vhost est recopié et nginx est rechargé par le déploiement.
    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
        return 200 "Contact: mailto:clementfilisetti@berrymappemonde.org\nExpires: 2027-10-17T23:59:59.000Z\nPreferred-Languages: fr, en\nCanonical: https://naviguide.fr/.well-known/security.txt\n";
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
