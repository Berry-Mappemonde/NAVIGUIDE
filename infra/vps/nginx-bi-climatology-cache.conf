# /etc/nginx/conf.d/bi-climatology-cache.conf — bloc http{} (OVH VPS).
#
# Cache nginx des réponses climatologie de Blue Intelligence
# (/api/climatology/point, /crossings, /*.geojson). L'atlas 1980-2020 est
# immuable : une même URL renvoie toujours la même réponse.
#
# Incident 2026-09-21 : le film du simulateur (dev Vite, Playwright, agents)
# a envoyé 600-800 requêtes/s vers blueintelligence.online ; chaque
# `crossings` coûte ~1 s de CPU Python. 768 worker_connections saturées,
# backend « Too many open files », Cloudflare 500 / 525. Avec ce cache une
# rafale d'URL répétées ne touche le backend qu'une fois.
#
# Installé par infra/vps/naviguide/deploy-simulator.sh, avec le snippet
# snippets/bi-climatology-cache.conf inclus dans les 3 vhosts.

proxy_cache_path /var/cache/nginx/bi-climatology levels=1:2
    keys_zone=bi_climo:20m max_size=300m inactive=30d use_temp_path=off;

# Clé partagée entre blueintelligence.online (/api/climatology/…) et les
# sites NAVIGUIDE (/bi/climatology/…) : « point?lat=…&lon=…&month=… ».
map $uri $climo_path {
    ~^/(api|bi)/climatology/(?<rest>.*)$ $rest;
    default $uri;
}
