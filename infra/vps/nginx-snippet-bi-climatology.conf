# /etc/nginx/snippets/bi-climatology-cache.conf
# À inclure dans une `location` qui proxy_pass vers BI /api/climatology/.
# Zone `bi_climo` et variable $climo_path : conf.d/bi-climatology-cache.conf.
#
# - proxy_cache_lock : 50 requêtes identiques en vol = 1 seul calcul backend.
# - proxy_ignore_client_abort : une requête annulée par le navigateur (tick
#   suivant du film) finit quand même et remplit le cache.
# - use_stale : backend lent / 5xx → dernière réponse connue plutôt qu'une erreur.
# - Cache-Control / Expires du backend ignorés pour la décision de cache :
#   l'atlas est immuable, la durée est fixée ici (30 jours).

proxy_cache bi_climo;
proxy_cache_key "$climo_path$is_args$args";
proxy_cache_valid 200 30d;
proxy_cache_valid 400 404 1m;
proxy_cache_lock on;
proxy_cache_lock_timeout 20s;
proxy_cache_lock_age 20s;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_ignore_client_abort on;
proxy_ignore_headers Cache-Control Expires;
